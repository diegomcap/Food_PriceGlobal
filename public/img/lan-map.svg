<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Mapa simplificado da América Latina -->
  <path d="M400,100 C250,150 150,300 200,500 C250,700 400,750 550,650 C700,550 700,350 600,200 C500,50 400,100 400,100 Z" fill="#3498db" stroke="#2c3e50" stroke-width="5"/>
  
  <!-- Países principais -->
  <circle cx="350" cy="200" r="40" fill="#f1c40f" stroke="#2c3e50" stroke-width="2"/>
  <text x="350" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">México</text>
  
  <circle cx="400" cy="300" r="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Colombia</text>
  
  <circle cx="450" cy="400" r="35" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Brasil</text>
  
  <circle cx="350" cy="450" r="25" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
  <text x="350" y="455" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Peru</text>
  
  <circle cx="300" cy="550" r="30" fill="#e67e22" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Chile</text>
  
  <circle cx="400" cy="550" r="30" fill="#1abc9c" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Argentina</text>
  
  <!-- Rotas de exportação -->
  <path d="M350,200 C400,250 450,300 450,400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,5"/>
  <path d="M400,300 C420,350 440,380 450,400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,5"/>
  <path d="M350,450 C380,430 420,410 450,400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,5"/>
  <path d="M300,550 C350,500 400,450 450,400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,5"/>
  <path d="M400,550 C420,500 440,450 450,400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Rotas para mercados globais -->
  <path d="M450,400 C550,350 650,300 750,250" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="600" y="300" font-family="Arial" font-size="14" fill="#e74c3c">Europa</text>
  
  <path d="M450,400 C500,300 550,200 600,100" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="550" y="150" font-family="Arial" font-size="14" fill="#3498db">América do Norte</text>
  
  <path d="M450,400 C550,450 650,500 750,550" fill="none" stroke="#2ecc71" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="600" y="500" font-family="Arial" font-size="14" fill="#2ecc71">Ásia</text>
  
  <!-- Produtos de exportação -->
  <text x="320" y="170" font-family="Arial" font-size="10" fill="#2c3e50">Abacate, Tomate</text>
  <text x="370" y="270" font-family="Arial" font-size="10" fill="#2c3e50">Café, Flores</text>
  <text x="420" y="370" font-family="Arial" font-size="10" fill="#2c3e50">Soja, Carne</text>
  <text x="320" y="420" font-family="Arial" font-size="10" fill="#2c3e50">Quinoa, Aspargos</text>
  <text x="270" y="520" font-family="Arial" font-size="10" fill="#2c3e50">Vinho, Frutas</text>
  <text x="370" y="520" font-family="Arial" font-size="10" fill="#2c3e50">Carne, Trigo</text>
  
  <!-- Título -->
  <text x="400" y="80" font-family="Arial" font-weight="bold" font-size="24" text-anchor="middle" fill="#2c3e50">América Latina - Exportação de Alimentos</text>
  
  <!-- Legenda -->
  <rect x="600" y="600" width="150" height="150" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="675" y="620" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Legenda</text>
  
  <circle cx="620" cy="640" r="10" fill="#f1c40f" stroke="#2c3e50" stroke-width="1"/>
  <text x="680" y="645" font-family="Arial" font-size="12" fill="#2c3e50">País Exportador</text>
  
  <line x1="610" y1="670" x2="630" y2="670" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="680" y="675" font-family="Arial" font-size="12" fill="#2c3e50">Rota Regional</text>
  
  <line x1="610" y1="700" x2="630" y2="700" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="680" y="705" font-family="Arial" font-size="12" fill="#2c3e50">Rota Internacional</text>
  
  <rect x="610" y="725" width="20" height="10" fill="#3498db"/>
  <text x="680" y="735" font-family="Arial" font-size="12" fill="#2c3e50">Área de Produção</text>
</svg>